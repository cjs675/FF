[package]
name = "ff-app"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "ff"
path = "src/main.rs"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
ff-core = { path = "../core" }
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy", "parsing"] }

[features]
default = ["fsearch-macos"]
fsearch-macos = ["ff-core/fsearch-macos"]

