[package]
name = "ff-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = ["fsearch-macos"]
fsearch-macos = ["dep:fsearch"]

[dependencies]
notify = "8.2.1"

[target.'cfg(target_os = "macos")'.dependencies]
fsearch = { path = "../../../fsearch", optional = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"

[[bench]]
name = "find_gate"
harness = false


