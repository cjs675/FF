[package]
name = "ff-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = ["fsearch-macos"]
fsearch-macos = ["dep:fsearch"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "ico", "bmp"] }
notify = "8.2.1"
trash = "5.3.0"

[target.'cfg(target_os = "macos")'.dependencies]
fsearch = { path = "../../../fsearch", optional = true }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSString", "NSError"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"

[[bench]]
name = "find_gate"
harness = false


